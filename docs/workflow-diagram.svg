<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Simple Canvas to CoEqual Assignment Workflow</title>
  <desc id="desc">A simple read-only workflow: provide Canvas link, read Canvas, prepare CoEqual draft, verify against Canvas, stop and ask if anything is missing, ask before final creation, then create only in CoEqual.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d4f6c"/>
    </marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a44b16"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 27px Arial, sans-serif; fill: #12263a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #536579; }
      .box { fill: #ffffff; stroke: #b7c6d6; stroke-width: 2; rx: 10; }
      .safe { fill: #eefaf1; stroke: #2f855a; stroke-width: 2; rx: 10; }
      .check { fill: #f3f0ff; stroke: #7353c7; stroke-width: 2; rx: 10; }
      .stop { fill: #fff7ed; stroke: #c05621; stroke-width: 2; rx: 10; }
      .done { fill: #edf7ff; stroke: #2b6cb0; stroke-width: 2; rx: 10; }
      .label { font: 700 17px Arial, sans-serif; fill: #12263a; }
      .text { font: 400 14px Arial, sans-serif; fill: #44566c; }
      .small { font: 700 12px Arial, sans-serif; fill: #2f6f44; }
      .arrow { stroke: #2d4f6c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .warnLine { stroke: #a44b16; stroke-width: 2.5; fill: none; marker-end: url(#warnArrow); }
      .softLine { stroke: #7b8794; stroke-width: 2; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="980" height="620"/>
  <text class="title" x="490" y="42" text-anchor="middle">Canvas to CoEqual Assignment Workflow</text>
  <text class="subtitle" x="490" y="68" text-anchor="middle">Accurate, source-grounded setup with Canvas kept read-only</text>

  <rect class="safe" x="640" y="100" width="265" height="118"/>
  <text class="label" x="772.5" y="130" text-anchor="middle">Safety Rules</text>
  <text class="text" x="772.5" y="157" text-anchor="middle">Canvas is read-only</text>
  <text class="text" x="772.5" y="180" text-anchor="middle">Rubric values stay exact</text>
  <text class="text" x="772.5" y="203" text-anchor="middle">No unsupported course material</text>

  <rect class="box" x="85" y="105" width="430" height="62"/>
  <text class="label" x="300" y="132" text-anchor="middle">1. User Provides Canvas Link</text>
  <text class="text" x="300" y="153" text-anchor="middle">The Canvas assignment/discussion URL starts the run.</text>

  <rect class="safe" x="85" y="205" width="430" height="76"/>
  <text class="label" x="300" y="233" text-anchor="middle">2. Read Canvas Only</text>
  <text class="text" x="300" y="255" text-anchor="middle">Extract assignment instructions, rubric, points, and linked material.</text>
  <text class="small" x="300" y="273" text-anchor="middle">No edit, save, publish, grade, upload, reply, or delete actions.</text>

  <rect class="box" x="85" y="319" width="430" height="76"/>
  <text class="label" x="300" y="347" text-anchor="middle">3. Prepare CoEqual Draft</text>
  <text class="text" x="300" y="369" text-anchor="middle">Enter title, assignment type, total points, exact rubric,</text>
  <text class="text" x="300" y="388" text-anchor="middle">course material context, and instructor grading notes.</text>

  <rect class="check" x="85" y="433" width="430" height="76"/>
  <text class="label" x="300" y="461" text-anchor="middle">4. Verify Against Canvas</text>
  <text class="text" x="300" y="483" text-anchor="middle">Read back CoEqual fields and compare them to Canvas facts.</text>
  <text class="text" x="300" y="502" text-anchor="middle">Check title, points, rubric criteria, values, and notes.</text>

  <rect class="check" x="610" y="319" width="285" height="76"/>
  <text class="label" x="752.5" y="347" text-anchor="middle">5. Anything Missing?</text>
  <text class="text" x="752.5" y="369" text-anchor="middle">If information is missing or mismatched,</text>
  <text class="text" x="752.5" y="388" text-anchor="middle">the workflow stops and asks the user.</text>

  <rect class="stop" x="610" y="433" width="285" height="76"/>
  <text class="label" x="752.5" y="461" text-anchor="middle">Stop And Ask</text>
  <text class="text" x="752.5" y="483" text-anchor="middle">Do not guess, round, invent,</text>
  <text class="text" x="752.5" y="502" text-anchor="middle">or edit Canvas to resolve uncertainty.</text>

  <rect class="done" x="305" y="542" width="370" height="54"/>
  <text class="label" x="490" y="565" text-anchor="middle">6. Ask Before Final Create</text>
  <text class="text" x="490" y="586" text-anchor="middle">Create the assignment in CoEqual only after user confirmation.</text>

  <path class="arrow" d="M300 167 L300 205"/>
  <path class="arrow" d="M300 281 L300 319"/>
  <path class="arrow" d="M300 395 L300 433"/>
  <path class="arrow" d="M515 471 C565 471 575 357 610 357"/>
  <path class="warnLine" d="M752.5 395 L752.5 433"/>
  <path class="arrow" d="M610 357 C540 357 490 475 490 542"/>
  <path class="softLine" d="M640 160 C570 160 545 238 515 243"/>
  <path class="softLine" d="M640 170 C565 215 555 350 515 357"/>
  <path class="softLine" d="M640 185 C585 250 558 460 515 471"/>
</svg>
